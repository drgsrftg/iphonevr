name: Build iPhoneVR SteamVR Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get OpenVR headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ValveSoftware/openvr.git openvr

      - name: Build driver
        shell: cmd
        working-directory: steamvr_driver
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist bin\win64 mkdir bin\win64
          cl /nologo /std:c++17 /EHsc /LD /I ..\openvr\headers driver.cpp /link /OUT:bin\win64\driver_iPhoneVR.dll Ws2_32.lib

      - name: Assemble SteamVR driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\driver\iphonevr\bin\win64 | Out-Null
          Copy-Item steamvr_driver\driver.vrdrivermanifest artifact\driver\iphonevr\
          Copy-Item steamvr_driver\bin\win64\driver_iPhoneVR.dll artifact\driver\iphonevr\bin\win64\
          @'
          {
            "driver_iPhoneVR": {
              "windowWidth": 1920,
              "windowHeight": 1080,
              "renderTargetMultiplier": 1.0
            }
          }
          '@ | Set-Content artifact\driver\iphonevr\resources.vrsettings -Encoding utf8

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneVR-SteamVR-Driver
          path: artifact\driver\iphonevr
          if-no-files-found: error
