name: Build iPhoneVR IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: iPhoneVR
          options:
            bundleIdPrefix: com.drgsrftg
            deploymentTarget:
              iOS: "16.0"
          targets:
            iPhoneVR:
              type: application
              platform: iOS
              sources:
                - path: Sources/iPhoneVR
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.drgsrftg.iPhoneVR
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_NSMotionUsageDescription: "Hareket sensörü VR kafa takibi için kullanılır."
                SWIFT_VERSION: 5.9
          EOF
          mkdir -p Sources/iPhoneVR
          cp ContentView.swift Sources/iPhoneVR/ContentView.swift
          cat > Sources/iPhoneVR/iPhoneVRApp.swift <<'EOF'
          import SwiftUI
          @main
          struct iPhoneVRApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          EOF
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project iPhoneVR.xcodeproj \
            -scheme iPhoneVR \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf Payload iPhoneVR.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/iPhoneVR.app Payload/
          zip -qry iPhoneVR.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneVR-IPA
          path: iPhoneVR.ipa
